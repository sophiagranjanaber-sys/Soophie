<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Voor ik vergeet</title>
    <link rel="stylesheet" href="./assets/style/spinvis.css" />

    <meta name="keywords" content="…" />
</head>
<body>

  <h1>
    <div>
      <span>Voor</span>
    </div>
    <div>
      <span>voor</span>
      <span>ik</span>
    </div>
    <div>
      <span>ik</span>
      <span>vergeet</span>
    </div>
    <div>
      <span>Vergeten ben</span>
    </div>
  </h1>

  <h2>
    <span>K</span>
    <span>o</span>
    <span>n</span>
    <span>i</span>
    <span>n</span>
    <span>g</span>
    <span>i</span>
    <span>n</span>
    <span>n</span>
    <span>e</span>
    <span>n</span>
    <span>d</span>
    <span>a</span>
    <span>g</span>
  </h2>

  <p>En wie toen mijn vrienden zijn geweest</p>

  <!-- Onderste dynamische sectie met de drie visuele blokken -->
  <div>
    <!-- Blok links: 'En niets meer weet van' (eerste p in deze container) -->
    <p>
      <span>En</span>
      <span>nie<span>e</span>ts</span>
      <span>meer</span>
      <span>weet</span>
      <span>van</span>
    </p>

    <!-- Blok midden: cirkeltekst (tweede p in deze container) -->
    <p>
      <span>Stratenenexamens</span>
      <span>envakanties</span>
    </p>

    <!-- Blok rechts: 'En ruzie op een feest' (derde p in deze container) -->
    <p>
      <span>En</span>
      <span>ruzie op</span>
      <span>een feest</span>
    </p>
  </div>

</body>
